<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UWE Outlook Web – Student Mailbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --outlook-blue: #0078d4;
  --outlook-dark: #f3f2f1;
  --bg-sidebar: #faf9f8;
  --bg-reading: #ffffff;
  --border-color: #edebe9;
  --text-main: #323130;
  --text-muted: #605e5c;
  --accent-red: #d13438;
  --accent-green: #107c41;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  background: var(--outlook-dark);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Office 365 Top Navigation Bar */
.o365-header {
  height: 48px;
  background: var(--outlook-blue);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  font-size: 14px;
  font-weight: 600;
}

.o365-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.o365-status {
  font-size: 12px;
  font-weight: 400;
  background: rgba(0,0,0,0.15);
  padding: 4px 10px;
  border-radius: 4px;
}

/* Mail Workspace Layout */
.mail-app-container {
  flex: 1;
  display: grid;
  grid-template-columns: 340px 1fr;
  overflow: hidden;
  background: white;
}

@media(max-width: 800px) {
  .mail-app-container { grid-template-columns: 1fr; }
  .sidebar-pane { display: none; }
}

/* Left Sidebar: Message List */
.sidebar-pane {
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.sidebar-title-bar {
  padding: 16px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-main);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.mail-list-item {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-color);
  cursor: pointer;
  transition: background 0.1s;
}

.mail-list-item:hover { background: #f1f0ef; }
.mail-list-item.active { background: #eff6fc; border-left: 4px solid var(--outlook-blue); }

.mail-item-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 3px;
}

.mail-item-sender {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

.mail-item-time {
  font-size: 11px;
  color: var(--text-muted);
}

.mail-item-subj {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.mail-item-preview {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Right Pane: Reading Canvas */
.reading-pane {
  background: var(--bg-reading);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow-y: auto;
  padding: 32px 40px;
}

.email-header-section {
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 20px;
  margin-bottom: 24px;
}

.email-subject-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-main);
  margin: 0 0 16px 0;
}

.sender-info-block {
  display: flex;
  align-items: center;
  gap: 12px;
}

.sender-avatar-circle {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #004578;
  color: white;
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: 15px;
}

.sender-details h4 {
  margin: 0 0 2px 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}

.sender-details span {
  font-size: 12px;
  color: var(--text-muted);
  font-family: monospace;
}

.email-body-content {
  font-size: 14px;
  line-height: 1.6;
  color: #3b3a39;
  margin-bottom: 40px;
}

/* Action Control Toolbar */
.mail-action-toolbar {
  background: var(--bg-sidebar);
  border: 1px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.toolbar-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}

.toolbar-buttons {
  display: flex;
  gap: 10px;
}

.action-btn {
  padding: 8px 16px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.15s;
}

.btn-legit { background: #ffffff; color: var(--accent-green); border-color: var(--accent-green); }
.btn-legit:hover { background: rgba(16, 124, 65, 0.05); }

.btn-phish { background: #ffffff; color: var(--accent-red); border-color: var(--accent-red); }
.btn-phish:hover { background: rgba(209, 52, 56, 0.05); }

.btn-hint { background: #ffffff; color: #8a6d3b; border-color: #f0ad4e; }
.btn-hint:hover { background: rgba(240, 173, 78, 0.05); }

/* Modal Feedback System */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 16px;
}

.modal-dialog {
  background: white;
  border-radius: 8px;
  padding: 28px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  text-align: center;
}

.modal-dialog h2 { margin-top: 0; font-size: 20px; }
.modal-dialog h2.correct { color: var(--accent-green); }
.modal-dialog h2.wrong { color: var(--accent-red); }
.modal-dialog p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin: 16px 0 24px 0; }

.modal-confirm-btn {
  background: var(--outlook-blue);
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

/* Accessibility Mode */
body.a11y-mode {
  zoom: 1.15;
  filter: contrast(1.08);
}
</style>
</head>

<body>
<script>
(function() {
  try {
    if (localStorage.getItem("phishguard_a11y_mode") === "true") {
      document.body.classList.add("a11y-mode");
    }
  } catch (e) {}
})();
</script>

<header class="o365-header">
  <div class="o365-brand">
    <span>Outlook – Student Webmail</span>
  </div>
  <div class="o365-status" id="caseCounter">Inbox Case 1 of 4</div>
</header>

<main class="mail-app-container">
  <!-- Sidebar Message List -->
  <aside class="sidebar-pane">
    <div class="sidebar-title-bar">
      <span>Focused Inbox</span>
      <span style="font-size: 12px; color: var(--text-muted);">Unread</span>
    </div>
    <div id="sidebarMailList"></div>
  </aside>

  <!-- Reading Pane -->
  <section class="reading-pane">
    <div>
      <div class="email-header-section">
        <h1 class="email-subject-title" id="viewSubject">Loading Subject...</h1>
        <div class="sender-info-block">
          <div class="avatar-circle" id="viewAvatar">U</div>
          <div class="sender-details">
            <h4 id="viewSenderName">University IT Helpdesk</h4>
            <span id="viewSenderAddress">&lt;support@uwe-ac-uk-verify.com&gt;</span>
          </div>
        </div>
      </div>

      <div class="email-body-content" id="viewBody">
        Loading email body...
      </div>
    </div>

    <!-- Action Toolbar -->
    <div class="mail-action-toolbar">
      <span class="toolbar-label">Assess Email Legitimacy:</span>
      <div class="toolbar-buttons">
        <button class="action-btn btn-legit" onclick="processVerdict('safe')">✓ Mark Safe</button>
        <button class="action-btn btn-phish" onclick="processVerdict('phishing')">🚨 Report Phishing</button>
        <button class="action-btn btn-hint" onclick="openHint()">🔍 Clue</button>
      </div>
    </div>
  </section>
</main>

<div id="modalContainer"></div>

<script src="js/behaviour-engine.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const scenarios = [
    {
      id: "student-portal-verify",
      senderName: "University IT Services",
      senderEmail: "support@uwe-ac-uk-verify.com",
      timestamp: "08:42",
      subject: "Action Required: Verify Your Student Portal Password",
      preview: "Your university portal password must be verified...",
      body: "Dear Student,<br><br>Routine maintenance requires all active student accounts to re-verify credentials within 24 hours. Failure to complete this process will result in immediate suspension of network access, library privileges, and student portal access.<br><br>👉 <strong><a href='#' onclick='return false;' style='color:#0078d4;'>Click here to verify your UWE account credentials</a></strong><br><br>Regards,<br>Campus IT Services",
      correct: "phishing",
      trigger: "authority",
      hint: "Examine the sender address domain carefully. Does 'uwe-ac-uk-verify.com' match the genuine university web infrastructure?"
    },
    {
      id: "student-course-reg",
      senderName: "Academic Registry & Timetabling",
      senderEmail: "registry@uwe.ac.uk",
      timestamp: "Yesterday",
      subject: "Course Registration Confirmation - Semester B",
      preview: "Your course registration for the upcoming semester...",
      body: "Dear Student,<br><br>This is an automated confirmation that your module selections for Semester B have been successfully recorded in the central database. You can review your finalized timetable by logging directly into your standard student portal.<br><br>Regards,<br>Academic Registry Office",
      correct: "safe",
      trigger: null,
      hint: "This message originates from the official institutional domain (@uwe.ac.uk) and contains no threatening urgency or suspicious links."
    },
    {
      id: "student-scholarship",
      senderName: "Student Financial Awards Office",
      senderEmail: "awards-grant-portal@student-fund-hub.net",
      timestamp: "2 days ago",
      subject: "Exclusive Student Grant Allocation",
      body: "Congratulations Student,<br><br>You have been randomly selected from the institutional database to receive a special student cost-of-living financial allocation. To deposit these funds into your bank account, claim your grant via the external link below before the deadline expires.<br><br>👉 <strong><a href='#' onclick='return false;' style='color:#0078d4;'>Claim Student Financial Grant Now</a></strong><br><br>Student Awards Team",
      correct: "phishing",
      trigger: "financial-fear",
      hint: "Official financial awards or grants are never distributed via random external domains like 'student-fund-hub.net'."
    },
    {
      id: "student-library-notice",
      senderName: "UWE Library Services",
      senderEmail: "library-loans@uwe.ac.uk",
      timestamp: "3 days ago",
      subject: "Library Book Due Date Reminder",
      body: "Hello,<br><br>This is a standard reminder that your library loan item 'Database Systems Architecture' is due for return or renewal within 3 days. You can log into your account online or visit the campus library desk to renew.<br><br>Best wishes,<br>UWE Library Services",
      correct: "safe",
      trigger: null,
      hint: "Standard administrative notices from the library come from recognized institutional addresses and use normal self-service procedures."
    }
  ];

  let currentIndex = 0;
  let userScore = 0;
  let startTime = Date.now();

  function renderSidebar() {
    let listHTML = "";
    scenarios.forEach((s, idx) => {
      listHTML += `
        <div class="mail-list-item ${idx === currentIndex ? 'active' : ''}" onclick="switchScenario(${idx})">
          <div class="mail-item-header">
            <span class="mail-item-sender">${s.senderName}</span>
            <span class="mail-item-time">${s.timestamp}</span>
          </div>
          <div class="mail-item-subj">${s.subject}</div>
          <div class="mail-item-preview">${s.preview}</div>
        </div>
      `;
    });
    document.getElementById("sidebarMailList").innerHTML = listHTML;
  }

  function renderActiveEmail() {
    const s = scenarios[currentIndex];
    document.getElementById("caseCounter").textContent = `Inbox Case ${currentIndex + 1} of ${scenarios.length}`;
    document.getElementById("viewSubject").textContent = s.subject;
    document.getElementById("viewSenderName").textContent = s.senderName;
    document.getElementById("viewSenderAddress").textContent = `<${s.senderEmail}>`;
    document.getElementById("viewAvatar").textContent = s.senderName.charAt(0);
    document.getElementById("viewBody").innerHTML = s.body;

    renderSidebar();
    startTime = Date.now();
  }

  window.switchScenario = function(idx) {
    currentIndex = idx;
    renderActiveEmail();
  };

  window.processVerdict = function(choice) {
    const s = scenarios[currentIndex];
    const isCorrect = (choice === s.correct);
    const responseTime = Date.now() - startTime;

    if (isCorrect) userScore++;

    if (window.PhishGuardEngine) {
      window.PhishGuardEngine.recordSimulation({
        userMode: "student",
        simulation: "inbox",
        scenarioId: s.id,
        trigger: s.trigger || "none",
        correct: isCorrect,
        action: choice === "safe" ? "mark_safe" : "flag_phish",
        responseTime: responseTime,
        confidence: 4,
        hintUsed: false,
        difficulty: 1,
        phase: "standard"
      });
    }

    showModalFeedback(isCorrect, s);
  };

  window.openHint = function() {
    const s = scenarios[currentIndex];
    document.getElementById("modalContainer").innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-dialog">
          <h2 style="color: #b8860b;">🔍 Security Investigator Clue</h2>
          <p>${s.hint}</p>
          <button class="modal-confirm-btn" onclick="closeModal()">Return to Mailbox</button>
        </div>
      </div>
    `;
  };

  function showModalFeedback(isCorrect, s) {
    const isLast = currentIndex + 1 >= scenarios.length;
    document.getElementById("modalContainer").innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-dialog">
          <h2 class="${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? "✓ Correct Assessment!" : "⚠️ Threat Misidentified"}</h2>
          <p>This message was actually <strong>${s.correct.toUpperCase()}</strong>. ${isCorrect ? "Excellent job inspecting the underlying sender domain and headers." : "Falling for this trap in a real university inbox would compromise your credentials."}</p>
          <button class="modal-confirm-btn" onclick="${isLast ? 'finishLabSession()' : 'advanceScenario()'}">${isLast ? 'View Final Results' : 'Next Email →'}</button>
        </div>
      </div>
    `;
  }

  window.closeModal = function() {
    document.getElementById("modalContainer").innerHTML = "";
  };

  window.advanceScenario = function() {
    closeModal();
    currentIndex++;
    renderActiveEmail();
  };

  window.finishLabSession = function() {
    const accuracy = Math.round((userScore / scenarios.length) * 100);
    const redirectUrl = `training.html?mode=student&score=${userScore}&total=${scenarios.length}&accuracy=${accuracy}`;

    document.getElementById("modalContainer").innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-dialog">
          <h2 class="correct">Module Completed Successfully</h2>
          <p>Final Score: <strong>${userScore} / ${scenarios.length}</strong> (${accuracy}% accuracy).<br><br>All telemetry recorded to your behavioral command center.</p>
          <button class="modal-confirm-btn" onclick="window.location.href='${redirectUrl}'">Return to Dashboard</button>
        </div>
      </div>
    `;
  };

  renderActiveEmail();
});
</script>

</body>
</html>
