<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhishGuard – Advanced Spoofed Login Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* Background grid */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(to right, #80808012 1px, transparent 1px),
    linear-gradient(to bottom, #80808012 1px, transparent 1px);
  background-size: 24px 24px;
  z-index: -2;
}

/* Glow */
.glow {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 800px;
  height: 800px;
  background: rgba(0, 150, 255, 0.1);
  border-radius: 50%;
  filter: blur(120px);
  transform: translate(-50%, -50%);
  z-index: -1;
}

.container {
  max-width: 480px;
  width: 100%;
  text-align: center;
}

.lab-counter {
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #00aaff;
  margin-bottom: 12px;
}

/* Browser Chrome Simulation Bar */
.browser-window {
  background: #1a1a1a;
  border: 1px solid #333;
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
}

.browser-dots {
  display: flex;
  gap: 6px;
}
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-red { background: #ff5f56; }
.dot-yellow { background: #ffbd2e; }
.dot-green { background: #27c93f; }

.url-bar {
  flex: 1;
  background: #0d0d0d;
  border: 1px solid #333;
  padding: 6px 12px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 11px;
  color: #888;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 6px;
}
.url-bar .lock-icon { color: #27c93f; }
.url-bar span { color: #00aaff; font-weight: bold; }

/* Entra ID / SSO Card Container */
.sso-wrapper {
  background: #1a1a1a;
  border: 1px solid #333;
  border-top: none;
  border-radius: 0 0 10px 10px;
  padding: 35px;
  margin-bottom: 20px;
  text-align: left;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.microsoft-logo-group {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
}

.ms-grid {
  display: grid;
  grid-template-columns: repeat(2, 9px);
  gap: 2px;
}
.mg { width: 9px; height: 9px; }
.mg-1 { background: #f25022; }
.mg-2 { background: #7fba00; }
.mg-3 { background: #ffb900; }
.mg-4 { background: #00a4ef; }

.microsoft-logo-group span {
  font-size: 15px;
  font-weight: bold;
  color: white;
}

.card-title {
  font-size: 20px;
  font-weight: bold;
  color: #00aaff;
  margin: 0 0 14px 0;
}

.user-identity-badge {
  display: inline-block;
  background: #111;
  border: 1px solid #333;
  padding: 5px 10px;
  border-radius: 14px;
  font-size: 12px;
  font-family: monospace;
  color: #cccccc;
  margin-bottom: 16px;
}

.form-group {
  margin-bottom: 14px;
}

.form-input {
  width: 100%;
  background: #111;
  border: 1px solid #333;
  padding: 10px 12px;
  border-radius: 6px;
  color: #888;
  font-size: 13px;
  font-family: monospace;
  outline: none;
}

.form-action-btn {
  width: 100%;
  background: #00aaff;
  color: black;
  border: none;
  padding: 10px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  margin-top: 10px;
}

/* Security Assessment Toolbar */
.assessment-panel {
  background: #1a1a1a;
  border: 1px solid #333;
  padding: 16px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.panel-label {
  font-size: 13px;
  font-weight: bold;
  color: #cccccc;
}

.panel-buttons {
  display: flex;
  gap: 10px;
}

.eval-btn {
  padding: 10px 16px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  border: none;
  transition: opacity 0.2s;
}
.eval-btn:hover { opacity: 0.85; }
.btn-authentic { background: #27c93f; color: black; }
.btn-spoofed { background: #ff4444; color: white; }
.btn-inspector { background: #ffaa00; color: black; }

/* Modal Feedback System */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 20px;
}

.modal-card {
  background: #1a1a1a;
  border: 2px solid #00aaff;
  padding: 30px;
  width: 100%;
  max-width: 440px;
  border-radius: 12px;
  text-align: center;
}

.modal-card h2 {
  color: #00aaff;
  margin-top: 0;
  margin-bottom: 15px;
}
.modal-card h2.correct { color: #27c93f; }
.modal-card h2.wrong { color: #ff4444; }

.modal-card p {
  color: #cccccc;
  margin-bottom: 20px;
  font-size: 14px;
  line-height: 1.5;
}

.modal-primary-btn {
  background: #00aaff;
  color: black;
  border: none;
  padding: 12px 25px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* Accessibility Mode */
body.a11y-mode {
  zoom: 1.15;
  filter: contrast(1.08);
}
</style>
</head>

<body>
<script>
(function() {
  try {
    if (localStorage.getItem("phishguard_a11y_mode") === "true") {
      document.body.classList.add("a11y-mode");
    }
  } catch (e) {}
})();
</script>

<div class="bg-grid"></div>
<div class="glow"></div>

<div class="container">
  <div class="lab-counter" id="labCounter">Enterprise SSO Security Lab (Case 1 of 5)</div>

  <!-- Simulated Browser Window Bar -->
  <div class="browser-window">
    <div class="browser-dots">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
    </div>
    <div class="url-bar" id="browserUrlBar">
      <span class="lock-icon">🔒</span> https://<span>login.microsoftonline.com</span>/common/oauth2
    </div>
  </div>

  <!-- Simulated SSO Card -->
  <main class="sso-wrapper">
    <div class="microsoft-logo-group">
      <div class="ms-grid">
        <div class="mg mg-1"></div>
        <div class="mg mg-2"></div>
        <div class="mg mg-3"></div>
        <div class="mg mg-4"></div>
      </div>
      <span id="brandTitle">Microsoft</span>
    </div>

    <h1 class="card-title" id="cardTitle">Sign in</h1>
    
    <div class="user-identity-badge" id="userIdentity">student@uwe.ac.uk</div>

    <div class="form-group">
      <input type="text" class="form-input" id="inputField1" value="student@uwe.ac.uk" readonly>
    </div>
    <div class="form-group">
      <input type="password" class="form-input" value="••••••••••••" readonly>
    </div>

    <button class="form-action-btn" id="actionButton" onclick="return false;">Next</button>
  </main>

  <!-- Security Assessment Toolbar -->
  <footer class="assessment-panel">
    <span class="panel-label">Verify Gateway:</span>
    <div class="panel-buttons">
      <button class="eval-btn btn-authentic" onclick="submitVerdict('safe')">✓ Authentic</button>
      <button class="eval-btn btn-spoofed" onclick="submitVerdict('phishing')">🚨 Spoofed</button>
      <button class="eval-btn btn-inspector" onclick="openInspector()">🔍 Clue</button>
    </div>
  </footer>
</div>

<div id="modalContainer"></div>

<script src="js/behaviour-engine.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const scenarios = [
    {
      id: "entra-typo-subdomain",
      brand: "Microsoft Entra ID",
      title: "Sign in to your account",
      identity: "22045912@live.uwe.ac.uk",
      urlHTML: '<span class="lock-icon">🔒</span> https://<span>login.microsoftonline.com-auth.net</span>/common/oauth2/authorize',
      buttonText: "Sign in",
      correct: "phishing",
      trigger: "authority",
      hint: "Examine the URL bar suffix closely. Although 'login.microsoftonline.com' appears first, it is a deceptive subdomain attached to the external root domain '-auth.net'."
    },
    {
      id: "uwe-sso-auth",
      brand: "UWE Bristol Single Sign-On",
      title: "University Identity Provider",
      identity: "student@uwe.ac.uk",
      urlHTML: '<span class="lock-icon">🔒</span> https://<span>sso.uwe.ac.uk</span>/idp/profile/SAML2/Redirect/SSO',
      buttonText: "Authenticate",
      correct: "safe",
      trigger: null,
      hint: "This login screen is hosted securely on the official institutional subdomain 'sso.uwe.ac.uk' backed by valid university certificates."
    },
    {
      id: "microsoft-oauth-consent",
      brand: "Microsoft Azure AD – App Consent",
      title: "Permissions requested",
      identity: "App: 'UWE Student Grant Portal Sync'",
      urlHTML: '<span class="lock-icon">🔒</span> https://<span>login.microsoftonline.com.student-fund-hub.net</span>/oauth2/consent',
      buttonText: "Accept Permissions",
      correct: "phishing",
      trigger: "financial-fear",
      hint: "Notice that the genuine Microsoft root domain is missing. The URL terminates at 'student-fund-hub.net' which is designed to harvest OAuth tokens."
    },
    {
      id: "uwe-library-shibboleth",
      brand: "UWE Library Services",
      title: "Library Account Login",
      identity: "Library Member Barcode",
      urlHTML: '<span class="lock-icon">🔒</span> https://<span>library.uwe.ac.uk</span>/auth/Shibboleth.sso/Login',
      buttonText: "Login",
      correct: "safe",
      trigger: null,
      hint: "This is a standard university library portal authenticated via official Shibboleth federation under the verified 'uwe.ac.uk' domain."
    },
    {
      id: "azure-portal-spoof",
      brand: "Microsoft Azure Management Portal",
      title: "Azure Cloud Infrastructure Login",
      identity: "admin-portal@uwe-cloud-verify.com",
      urlHTML: '<span class="lock-icon">🔒</span> https://<span>portal.azure.com.uwe-cloud-verify.com</span>/signin',
      buttonText: "Continue to Portal",
      correct: "phishing",
      trigger: "authority",
      hint: "A classic lookalike attack: prefixing 'portal.azure.com' before an attacker-controlled external domain ('uwe-cloud-verify.com')."
    }
  ];

  let currentIndex = 0;
  let sessionScore = 0;
  let startTime = Date.now();

  function renderScenario() {
    const s = scenarios[currentIndex];
    document.getElementById("labCounter").textContent = `Enterprise SSO Security Lab (Case ${currentIndex + 1} of ${scenarios.length})`;
    document.getElementById("browserUrlBar").innerHTML = s.urlHTML;
    document.getElementById("brandTitle").textContent = s.brand;
    document.getElementById("cardTitle").textContent = s.title;
    document.getElementById("userIdentity").textContent = s.identity;
    document.getElementById("inputField1").value = s.identity;
    document.getElementById("actionButton").textContent = s.buttonText;

    startTime = Date.now();
  }

  window.submitVerdict = function(choice) {
    const s = scenarios[currentIndex];
    const isCorrect = (choice === s.correct);
    const responseTime = Date.now() - startTime;

    if (isCorrect) sessionScore++;

    if (window.PhishGuardEngine) {
      window.PhishGuardEngine.recordSimulation({
        userMode: "student",
        simulation: "spoof",
        scenarioId: s.id,
        trigger: s.trigger || "none",
        correct: isCorrect,
        action: choice === "safe" ? "mark_safe" : "flag_phish",
        responseTime: responseTime,
        confidence: 4,
        hintUsed: false,
        difficulty: 2,
        phase: "standard"
      });
    }

    showFeedbackModal(isCorrect, s);
  };

  window.openInspector = function() {
    const s = scenarios[currentIndex];
    document.getElementById("modalContainer").innerHTML = `
      <div class="modal-overlay">
        <div class="modal-card">
          <h2>🔍 Security Investigator Clue</h2>
          <p>${s.hint}</p>
          <button class="modal-primary-btn" onclick="closeModal()">Return to Portal</button>
        </div>
      </div>
    `;
  };

  function showFeedbackModal(isCorrect, s) {
    const isLast = currentIndex + 1 >= scenarios.length;
    document.getElementById("modalContainer").innerHTML = `
      <div class="modal-overlay">
        <div class="modal-card">
          <h2 class="${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? "✓ Correct Assessment!" : "⚠️ Threat Misidentified"}</h2>
          <p>This sign-in gateway was actually <strong>${s.correct.toUpperCase()}</strong>. ${isCorrect ? "Excellent job analyzing the SSL certificate path and root domain structure." : "Falling for this credential harvesting gateway would compromise active session tokens."}</p>
          <button class="modal-primary-btn" onclick="${isLast ? 'finishLabSession()' : 'advanceScenario()'}">${isLast ? 'View Final Results' : 'Next Scenario →'}</button>
        </div>
      </div>
    `;
  }

  window.closeModal = function() {
    document.getElementById("modalContainer").innerHTML = "";
  };

  window.advanceScenario = function() {
    closeModal();
    currentIndex++;
    renderScenario();
  };

  window.finishLabSession = function() {
    const accuracy = Math.round((sessionScore / scenarios.length) * 100);
    const redirectUrl = `training.html?mode=student&score=${sessionScore}&total=${scenarios.length}&accuracy=${accuracy}`;

    document.getElementById("modalContainer").innerHTML = `
      <div class="modal-overlay">
        <div class="modal-card">
          <h2 class="correct">Module Completed Successfully</h2>
          <p>Final Score: <strong>${sessionScore} / ${scenarios.length}</strong> (${accuracy}% accuracy).<br><br>All telemetry recorded to your behavioral command center.</p>
          <button class="modal-primary-btn" onclick="window.location.href='${redirectUrl}'">Return to Dashboard</button>
        </div>
      </div>
    `;
  };

  renderScenario();
});
</script>

</body>
</html>
