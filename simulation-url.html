<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhishGuard – URL Inspection</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
  overflow-x: hidden;
}

/* Background grid */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(to right, #80808012 1px, transparent 1px),
    linear-gradient(to bottom, #80808012 1px, transparent 1px);
  background-size: 24px 24px;
  z-index: -2;
}

/* Glow */
.glow {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 800px;
  height: 800px;
  background: rgba(0, 150, 255, 0.1);
  border-radius: 50%;
  filter: blur(120px);
  transform: translate(-50%, -50%);
  z-index: -1;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
  text-align: center;
}

.title {
  font-size: 38px;
  font-weight: bold;
  margin-bottom: 10px;
  color: #00aaff;
}

.subtitle {
  font-size: 18px;
  color: #cccccc;
  margin-bottom: 40px;
}

/* Scenario box */
.scenario-box {
  background: #1a1a1a;
  border: 2px solid #333;
  padding: 25px;
  border-radius: 12px;
  text-align: left;
  margin-bottom: 30px;
}

.scenario-title {
  font-size: 22px;
  color: #00aaff;
  margin-bottom: 10px;
}

.url-box {
  background: #0d0d0d;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #333;
  color: #00ffcc;
  font-family: monospace;
  font-size: 16px;
  margin-top: 10px;
}

/* Buttons */
.btn-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 25px;
}

.sim-btn {
  background: #00aaff;
  color: black;
  padding: 14px 30px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.hint-btn {
  background: #ffaa00;
  color: black;
  padding: 14px 30px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

/* Feedback modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.modal {
  background: #1a1a1a;
  border: 2px solid #00aaff;
  padding: 30px;
  width: 420px;
  border-radius: 12px;
  text-align: center;
}

.modal h2 {
  color: #00aaff;
  margin-bottom: 15px;
}

.modal p {
  color: #cccccc;
  margin-bottom: 20px;
}

.modal-btn {
  background: #00aaff;
  color: black;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="glow"></div>

<div class="container">
  <div class="title">URL Inspection Simulation</div>
  <div class="subtitle">Inspect each URL carefully and decide if it is safe or malicious.</div>

  <div id="scenarioBox" class="scenario-box">
    <div id="scenarioTitle" class="scenario-title"></div>
    <div id="scenarioURL" class="url-box"></div>
  </div>

  <div class="btn-row">
    <button class="sim-btn" onclick="answer('safe')">Safe</button>
    <button class="sim-btn" onclick="answer('phishing')">Malicious</button>
    <button class="hint-btn" onclick="showHint()">Hint</button>
  </div>
</div>

<!-- Modal -->
<div id="modalContainer"></div>

<script>
/* READ MODE (student or elderly) */
const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");

/* URL SCENARIOS */
const studentURLs = [
  {
    title: "Fake University Login",
    url: "https://university-login-secure-verification.com",
    correct: "phishing",
    hint: "University portals never use long external domains."
  },
  {
    title: "Course Registration",
    url: "https://portal.university.edu/register",
    correct: "safe",
    hint: "Official portals use .edu or .ac.uk domains."
  },
  {
    title: "Scholarship Redirect",
    url: "http://scholarship-uni-offer.net",
    correct: "phishing",
    hint: "Real scholarships never use .net domains."
  }
];

const elderlyURLs = [
  {
    title: "Bank Verification",
    url: "https://secure-bank-verification-alert.com",
    correct: "phishing",
    hint: "Banks never use long hyphenated domains."
  },
  {
    title: "HMRC Tax Refund",
    url: "https://www.gov.uk/tax-refund",
    correct: "safe",
    hint: "Government sites always use gov.uk."
  },
  {
    title: "Pension Portal",
    url: "http://pension-secure-login.net",
    correct: "phishing",
    hint: "Financial services never use .net for login pages."
  }
];

const scenarios = mode === "student" ? studentURLs : elderlyURLs;

let index = 0;
let score = 0;

/* LOAD SCENARIO */
function loadScenario() {
  const s = scenarios[index];
  document.getElementById("scenarioTitle").textContent = s.title;
  document.getElementById("scenarioURL").textContent = s.url;
}

loadScenario();

/* ANSWER LOGIC */
function answer(choice) {
  const s = scenarios[index];
  const correct = (choice === s.correct);

  if (correct) score++;

  showFeedback(correct, s.correct);
}

/* FEEDBACK MODAL */
function showFeedback(correct, correctAnswer) {
  const modal = `
    <div class="modal-bg">
      <div class="modal">
        <h2>${correct ? "Correct!" : "Incorrect"}</h2>
        <p>The correct answer was: <strong>${correctAnswer.toUpperCase()}</strong></p>
        <button class="modal-btn" onclick="nextScenario()">Next</button>
      </div>
    </div>
  `;
  document.getElementById("modalContainer").innerHTML = modal;
}

/* HINT */
function showHint() {
  const s = scenarios[index];
  const modal = `
    <div class="modal-bg">
      <div class="modal">
        <h2>Hint</h2>
        <p>${s.hint}</p>
        <button class="modal-btn" onclick="closeModal()">Close</button>
      </div>
    </div>
  `;
  document.getElementById("modalContainer").innerHTML = modal;
}

function closeModal() {
  document.getElementById("modalContainer").innerHTML = "";
}

/* NEXT SCENARIO */
function nextScenario() {
  document.getElementById("modalContainer").innerHTML = "";
  index++;

  if (index >= scenarios.length) {
    endSimulation();
    return;
  }

  loadScenario();
}

/* END SIMULATION */
function endSimulation() {
  const modal = `
    <div class="modal-bg">
      <div class="modal">
        <h2>Simulation Complete</h2>
        <p>Your score: ${score} / ${scenarios.length}</p>
        <button class="modal-btn" onclick="window.location.href='training.html?mode=${mode}'">Return to Command Center</button>
      </div>
    </div>
  `;
  document.getElementById("modalContainer").innerHTML = modal;
}

function saveResult(simulation, score, total) {
  const mode = new URLSearchParams(window.location.search).get("mode");

  const accuracy = Math.round((score / total) * 100);

  const record = {
    mode,
    simulation,
    score,
    total,
    accuracy,
    time: new Date().toISOString()
  };

  // Load existing data
  let data = JSON.parse(localStorage.getItem("phishguard_data")) || [];

  // Add new record
  data.push(record);

  // Save back
  localStorage.setItem("phishguard_data", JSON.stringify(data));
}

</script>

</body>
</html>
