<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhishGuard – Threat Intelligence & Articles</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg-dark: #0f0f0f;
  --sidebar-bg: rgba(9, 13, 23, 0.95);
  --card-bg: #141414;
  --card-hover: #1a1a1a;
  --border-line: #222222;
  --cyan: #36e0d0;
  --blue-accent: #00aaff;
  --purple-accent: #9933ff;
  --pink-accent: #ff3366;
  --green-accent: #55d98b;
  --text-main: #f4f7fb;
  --text-muted: #9aa8bd;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg-dark);
  color: var(--text-main);
  display: flex;
  overflow-x: hidden;
  height: 100vh;
}

/* Background grid */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(to right, #80808012 1px, transparent 1px),
    linear-gradient(to bottom, #80808012 1px, transparent 1px);
  background-size: 24px 24px;
  z-index: -2;
}

/* Glow */
.glow {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 800px;
  height: 800px;
  background: rgba(0, 150, 255, 0.1);
  border-radius: 50%;
  filter: blur(120px);
  transform: translate(-50%, -50%);
  z-index: -1;
}

.sidebar {
  width: 240px;
  height: 100vh;
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  background: var(--sidebar-bg);
  border-right: 1px solid #26334a;
  backdrop-filter: blur(10px);
  box-sizing: border-box;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 32px;
  padding-left: 8px;
}

.brand-mark {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  background: rgba(54, 224, 208, 0.1);
  border: 1px solid rgba(54, 224, 208, 0.4);
  border-radius: 8px;
  color: var(--cyan);
  box-shadow: 0 0 15px rgba(54, 224, 208, 0.15);
}

.brand-text {
  color: var(--cyan);
  letter-spacing: 1.2px;
  font-weight: 800;
  font-size: 15px;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 8px;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s ease;
}

.sidebar-item svg {
  opacity: 0.7;
  transition: opacity 0.2s ease;
}

.sidebar-item:hover {
  color: var(--text-main);
  background: rgba(86, 183, 255, 0.08);
}

.sidebar-item:hover svg {
  opacity: 1;
}

.sidebar-item.active {
  color: var(--cyan);
  background: rgba(54, 224, 208, 0.1);
  border: 1px solid rgba(54, 224, 208, 0.25);
  font-weight: 600;
}

.sidebar-item.active svg {
  opacity: 1;
  color: var(--cyan);
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid #26334a;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.telemetry-label {
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
}

.status-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-main);
  font-size: 12px;
}

.status-dot {
  width: 7px;
  height: 7px;
  background-color: var(--green-accent);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(85, 217, 139, 0.6);
}

/* MAIN CONTENT */
.main {
  flex: 1;
  padding: 40px;
  overflow-y: auto;
  height: 100vh;
  box-sizing: border-box;
}

.header-title {
  font-size: 38px;
  color: var(--blue-accent);
  margin-bottom: 15px;
  font-weight: 800;
}

.header-subtitle {
  color: #cccccc;
  font-size: 15px;
  line-height: 1.5;
  max-width: 800px;
  margin-bottom: 30px;
}

/* CONTROLS BAR (Search & Filters) */
.controls-bar {
  display: flex;
  gap: 15px;
  margin-bottom: 30px;
  flex-wrap: wrap;
  align-items: center;
}

.search-input {
  background: var(--card-bg);
  border: 1px solid var(--border-line);
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  width: 280px;
  outline: none;
  transition: 0.2s;
}

.search-input:focus {
  border-color: var(--blue-accent);
  box-shadow: 0 0 10px rgba(0, 170, 255, 0.2);
}

.filter-chips {
  display: flex;
  gap: 8px;
}

.filter-chip {
  background: var(--card-bg);
  border: 1px solid var(--border-line);
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.filter-chip:hover, .filter-chip.active {
  background: rgba(0, 170, 255, 0.15);
  border-color: var(--blue-accent);
  color: white;
}

/* SECTION HEADINGS */
.section-heading {
  font-size: 24px;
  color: #ffffff;
  margin: 40px 0 20px 0;
  border-left: 4px solid var(--blue-accent);
  padding-left: 12px;
  font-weight: 700;
}

/* CARDS GRID */
.learn-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 25px;
  padding-bottom: 20px;
}

.learn-card {
  background: var(--card-bg);
  border: 2px solid var(--border-line);
  border-radius: 12px;
  padding: 25px;
  transition: 0.25s;
  position: relative;
}

.learn-card:hover {
  border-color: var(--blue-accent);
  background: var(--card-hover);
  transform: translateY(-2px);
}

.card-header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.card-title {
  font-size: 20px;
  font-weight: bold;
}

.card-title.urgency { color: var(--pink-accent); }
.card-title.authority { color: var(--blue-accent); }
.card-title.fear { color: var(--pink-accent); }
.card-title.familiarity { color: var(--purple-accent); }

.bookmark-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  transition: 0.2s;
}

.bookmark-btn:hover, .bookmark-btn.saved {
  color: #ffaa00;
}

.card-desc {
  color: #cccccc;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 20px;
}

.vector-box {
  background: #0d0d0d;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 15px;
}

.vector-label {
  font-size: 11px;
  text-transform: uppercase;
  color: #777;
  letter-spacing: 1px;
  margin-bottom: 6px;
  font-weight: bold;
}

.vector-content {
  font-family: monospace;
  font-size: 13px;
  color: #00ffcc;
}

/* ARTICLES SECTION */
.articles-stack {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-bottom: 50px;
}

.article-card {
  background: var(--card-bg);
  border: 2px solid var(--border-line);
  border-radius: 12px;
  padding: 25px;
  transition: 0.25s;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.article-card:hover {
  border-color: var(--blue-accent);
  background: var(--card-hover);
}

.article-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.article-tag {
  background: rgba(0, 170, 255, 0.15);
  color: var(--blue-accent);
  font-size: 11px;
  font-weight: bold;
  padding: 4px 10px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.article-date {
  color: #888;
  font-size: 13px;
}

.article-title {
  font-size: 18px;
  font-weight: bold;
  color: #fff;
}

.article-snippet {
  color: #ccc;
  font-size: 14px;
  line-height: 1.6;
}

.article-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 5px;
  border-top: 1px solid #222;
  padding-top: 15px;
}

.article-author {
  font-size: 12px;
  color: #aaa;
}

.article-read-time {
  font-size: 12px;
  color: var(--blue-accent);
}

/* ACCESSIBILITY MODE */
body.a11y-mode {
  zoom: 1.2;
  filter: contrast(1.08);
}

@media(max-width: 900px) {
  .learn-grid { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 20px; }
}
</style>
</head>

})();
</script>

<div class="main">
  <div class="header-title" id="learnHeaderTitle">Threat Intelligence</div>
  <div class="header-subtitle" id="learnHeaderSub">Loading intelligence briefing...</div>

  <!-- CONTROLS & SEARCH -->
  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search threat vectors or articles...">
    <div class="filter-chips">
      <button class="filter-chip active" data-filter="all">All Vectors</button>
      <button class="filter-chip" data-filter="urgency">Urgency</button>
      <button class="filter-chip" data-filter="authority">Authority</button>
      <button class="filter-chip" data-filter="fear">Fear</button>
      <button class="filter-chip" data-filter="familiarity">Familiarity</button>
    </div>
  </div>

  <!-- VECTORS GRID -->
  <div class="section-heading">Core Behavioral Vectors</div>
  <div class="learn-grid" id="learnGridContainer">
    <!-- Dynamic Content injected via script -->
  </div>

  <!-- ARTICLES SECTION -->
  <div class="section-heading">Real-Time Case Studies & Articles</div>
  <div class="articles-stack" id="articlesContainer">
    <!-- Dynamic Articles injected via script -->
  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode") || "student";

  const titleEl = document.getElementById("learnHeaderTitle");
  const subEl = document.getElementById("learnHeaderSub");
  const gridEl = document.getElementById("learnGridContainer");
  const articlesEl = document.getElementById("articlesContainer");
  const searchInput = document.getElementById("searchInput");

  // STUDENT VECTORS
  const studentContent = [
    {
      id: "s1",
      category: "urgency",
      title: "Academic Urgency",
      class: "urgency",
      desc: "Attackers exploit deadlines, exam stress, and library restrictions. They engineer panic by threatening immediate account lockout or course deregistration.",
      vector: "'Action Required: Unpaid library fine or your portal access will be revoked in 24 hours.'"
    },
    {
      id: "s2",
      category: "authority",
      title: "Administrative Authority",
      class: "authority",
      desc: "Impersonating university departments, IT help desks, or faculty deans. Students are conditioned to comply immediately with administrative directives.",
      vector: "'IT Services: Mandatory security patching required. Verify credentials now.'"
    },
    {
      id: "s3",
      category: "fear",
      title: "Financial Aid Fear",
      class: "fear",
      desc: "Leveraging high anxiety around tuition fees, housing deposits, or scholarship grants to bypass rational caution through engineered crisis.",
      vector: "'Your student loan disbursement has failed. Confirm bank details immediately to avoid cancellation.'"
    },
    {
      id: "s4",
      category: "familiarity",
      title: "Campus Portal Spoofing",
      class: "familiarity",
      desc: "Replicating exact layouts of learning management systems (like Blackboard or university portals) using typosquatted domains to harvest passwords.",
      vector: "'portal-verify-login.net' instead of the official institution portal."
    }
  ];

  // STUDENT ARTICLES
  const studentArticles = [
    {
      tag: "Case Study",
      date: "August 2026",
      title: "The Fall Semester Credential Harvesting Campaign",
      snippet: "How a sophisticated phishing wave targeted thousands of incoming university freshmen during welcome week with fake housing grant allocation notices, successfully mapping exact university portal interfaces.",
      author: "PhishGuard Threat Intelligence Unit",
      read: "4 min read"
    },
    {
      tag: "Analysis",
      date: "July 2026",
      title: "Why Multi-Factor Authentication Isn't Always Enough for Students",
      snippet: "Examining adversary-in-the-middle (AiTM) proxy kits that intercept session cookies in real-time even after standard student SSO login prompts.",
      author: "Campus Security Journal",
      read: "6 min read"
    }
  ];

  // ELDERLY VECTORS
  const elderlyContent = [
    {
      id: "e1",
      category: "urgency",
      title: "Pension & Benefit Urgency",
      class: "urgency",
      desc: "Scammers create artificial deadlines regarding state pensions, council tax brackets, or heating allowances to force rushed decision-making.",
      vector: "'Final Notice: Claim your government cost-of-living rebate before midnight today.'"
    },
    {
      id: "e2",
      category: "authority",
      title: "Government Authority",
      class: "authority",
      desc: "Impersonating trusted national entities like health services, tax authorities, or postal services to invoke instant trust and compliance.",
      vector: "'Legal Notice: A warrant has been issued for unpaid national insurance contributions.'"
    },
    {
      id: "e3",
      category: "fear",
      title: "Retirement Security Fear",
      class: "fear",
      desc: "Preying on anxieties surrounding lifetime savings security, frozen retirement accounts, or fabricated medical emergencies involving relatives.",
      vector: "'Urgent: Suspicious foreign login detected on your primary savings account. Secure funds now.'"
    },
    {
      id: "e4",
      category: "familiarity",
      title: "Trusted Brand Mimicry",
      class: "familiarity",
      desc: "Duplicating everyday service touchpoints—such as utility providers, local health clinics, or parcel delivery texts—to exploit ingrained habits.",
      vector: "'Royal Mail: Package delivery failed due to unpaid shipping fee of £1.50.'"
    }
  ];

  // ELDERLY ARTICLES
  const elderlyArticles = [
    {
      tag: "Consumer Alert",
      date: "August 2026",
      title: "Anatomy of a Fake Pension Re-indexing Scam",
      snippet: "A deep dive into how fraudulent SMS alerts regarding cost-of-living payouts trick retirees into calling scam call centers disguised as government agencies.",
      author: "Elder Fraud Prevention Watch",
      read: "5 min read"
    },
    {
      tag: "Research Brief",
      date: "June 2026",
      title: "Recognizing Impersonation Calls from False Utility Providers",
      snippet: "Practical guidance on verifying unexpected automated phone alerts regarding energy meter disconnection threats and fraudulent direct debit setups.",
      author: "Senior Digital Safety Board",
      read: "3 min read"
    }
  ];

  const activeContent = mode === "student" ? studentContent : elderlyContent;
  const activeArticles = mode === "student" ? studentArticles : elderlyArticles;

  if (titleEl) {
    titleEl.textContent = mode === "student" ? "Threat Intelligence – Student Focus" : "Threat Intelligence – Senior & Elder Focus";
  }
  if (subEl) {
    subEl.textContent = mode === "student"
      ? "Phishing targets university workflows, campus portals, and tuition systems. Study these behavioral vectors and real-time case studies tailored specifically for student defense."
      : "Scammers heavily target older adults using pension alerts, fake healthcare notifications, and financial impersonation. Study these common deception tactics and real-world briefings.";
  }

  let savedBookmarks = JSON.parse(localStorage.getItem("phishguard_bookmarks")) || [];

  function renderVectors(filter = "all", searchQuery = "") {
    let filtered = activeContent.filter(card => {
      let matchesFilter = (filter === "all" || card.category === filter);
      let matchesSearch = card.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                          card.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          card.vector.toLowerCase().includes(searchQuery.toLowerCase());
      return matchesFilter && matchesSearch;
    });

    if (filtered.length === 0) {
      gridEl.innerHTML = `<div style="grid-column: span 2; color: var(--text-muted); text-align: center; padding: 30px;">No threat vectors matched your search criteria.</div>`;
      return;
    }

    gridEl.innerHTML = filtered.map(card => {
      let isSaved = savedBookmarks.includes(card.id);
      return `
        <div class="learn-card">
          <div class="card-header-row">
            <div class="card-title ${card.class}">${card.title}</div>
            <button class="bookmark-btn ${isSaved ? 'saved' : ''}" data-id="${card.id}" title="Bookmark this vector">
              ${isSaved ? '★' : '☆'}
            </button>
          </div>
          <div class="card-desc">${card.desc}</div>
          <div class="vector-box">
            <div class="vector-label">Typical Attack Vector:</div>
            <div class="vector-content">${card.vector}</div>
          </div>
        </div>
      `;
    }).join('');

    // Attach bookmark listener
    document.querySelectorAll(".bookmark-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        let id = e.target.getAttribute("data-id");
        if (savedBookmarks.includes(id)) {
          savedBookmarks = savedBookmarks.filter(b => b !== id);
        } else {
          savedBookmarks.push(id);
        }
        localStorage.setItem("phishguard_bookmarks", JSON.stringify(savedBookmarks));
        renderVectors(document.querySelector(".filter-chip.active").getAttribute("data-filter"), searchInput.value);
      });
    });
  }

  function renderArticles() {
    articlesEl.innerHTML = activeArticles.map(art => `
      <div class="article-card">
        <div class="article-header">
          <span class="article-tag">${art.tag}</span>
          <span class="article-date">${art.date}</span>
        </div>
        <div class="article-title">${art.title}</div>
        <div class="article-snippet">${art.snippet}</div>
        <div class="article-footer">
          <span class="article-author">${art.author}</span>
          <span class="article-read-time">${art.read}</span>
        </div>
      </div>
    `).join('');
  }

  renderVectors("all", "");
  renderArticles();

  // Filter chips listeners
  document.querySelectorAll(".filter-chip").forEach(chip => {
    chip.addEventListener("click", (e) => {
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      e.target.classList.add("active");
      renderVectors(e.target.getAttribute("data-filter"), searchInput.value);
    });
  });

  // Search input listener
  searchInput.addEventListener("input", (e) => {
    let activeFilter = document.querySelector(".filter-chip.active").getAttribute("data-filter");
    renderVectors(activeFilter, e.target.value);
  });

  // Automatically preserve the audience mode parameter across all sidebar links
  document.querySelectorAll(".sidebar a").forEach(link => {
    let baseHref = link.getAttribute("href").split("?")[0];
    link.setAttribute("href", `${baseHref}?mode=${mode}`);
  });
});
</script>
<script src="js/js/behaviour-engine.js"></script>

</body>
</html>
