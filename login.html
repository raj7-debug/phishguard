<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhishGuard – Authentication Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg-dark: #0f0f0f;
  --card-bg: #1a1a1a;
  --border-line: #333333;
  --cyan: #36e0d0;
  --blue-accent: #00aaff;
  --text-main: #f4f7fb;
  --text-muted: #9aa8bd;
  --green-accent: #55d98b;
  --pink-accent: #ff4d4d;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(to right, #80808012 1px, transparent 1px),
      linear-gradient(to bottom, #80808012 1px, transparent 1px);
    background-size: 24px 24px;
    z-index: -2;
}

.glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 600px;
    background: rgba(0, 150, 255, 0.08);
    border-radius: 50%;
    filter: blur(100px);
    transform: translate(-50%, -50%);
    z-index: -1;
}

.auth-card {
    background: var(--card-bg);
    border: 2px solid var(--border-line);
    padding: 40px;
    width: 380px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
    animation: fadeIn 0.4s ease-out;
    box-sizing: border-box;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.auth-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 25px;
}

.brand-mark {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    background: rgba(54, 224, 208, 0.1);
    border: 1px solid rgba(54, 224, 208, 0.4);
    border-radius: 10px;
    color: var(--cyan);
    box-shadow: 0 0 15px rgba(54, 224, 208, 0.15);
    margin-bottom: 12px;
}

.auth-header h2 {
    margin: 0 0 5px 0;
    color: var(--blue-accent);
    font-size: 24px;
    font-weight: 800;
}

.auth-header p {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
}

/* Tabs */
.tabs {
    display: flex;
    margin-bottom: 25px;
    background: #222;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border-line);
}

.tab {
    flex: 1;
    padding: 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    transition: all 0.3s ease;
}

.tab.active {
    background: var(--blue-accent);
    color: black;
}

/* Form Styles */
.form-group {
    text-align: left;
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: #ccc;
    margin-bottom: 5px;
    font-weight: 600;
}

.form-group input {
    width: 100%;
    padding: 12px;
    background: #111;
    border: 1px solid var(--border-line);
    border-radius: 6px;
    color: white;
    font-size: 14px;
    box-sizing: border-box;
    transition: border-color 0.3s, box-shadow 0.3s;
}

.form-group input:focus {
    border-color: var(--blue-accent);
    box-shadow: 0 0 8px rgba(0, 170, 255, 0.3);
    outline: none;
}

/* Alert Message Box */
.alert-box {
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
    text-align: left;
}
.alert-box.error {
    background: rgba(255, 77, 77, 0.15);
    border: 1px solid var(--pink-accent);
    color: #ff8888;
}
.alert-box.success {
    background: rgba(0, 255, 136, 0.15);
    border: 1px solid var(--green-accent);
    color: #88ffbb;
}

.options-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
}

.options-row label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
}

.options-row a {
    color: var(--blue-accent);
    text-decoration: none;
}

.options-row a:hover {
    text-decoration: underline;
}

.submit-btn {
    width: 100%;
    background: var(--blue-accent);
    color: black;
    padding: 14px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s, transform 0.1s;
}

.submit-btn:hover {
    background: #0088cc;
}

.submit-btn:active {
    transform: scale(0.98);
}

.back-link {
    display: inline-block;
    margin-top: 15px;
    font-size: 13px;
    color: #777;
    text-decoration: none;
    transition: color 0.2s;
}

.back-link:hover {
    color: var(--text-main);
}

/* ACCESSIBILITY MODE */
body.a11y-mode {
  zoom: 1.2;
  filter: contrast(1.08);
}
</style>
</head>

<body>
<script>
(function() {
  try {
    if (localStorage.getItem("phishguard_a11y_mode") === "true") {
      document.body.classList.add("a11y-mode");
    }
  } catch (e) {}
})();
</script>

<div class="bg-grid"></div>
<div class="glow"></div>

<div class="auth-card">
    <div class="auth-header">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/></svg>
        </div>
        <h2 id="portalTitle">PhishGuard Portal</h2>
        <p id="portalSubtitle">Secure access for training simulation</p>
    </div>

    <!-- Alert banner for validation feedback -->
    <div id="alertBox" class="alert-box" role="alert"></div>

    <div class="tabs">
        <button class="tab active" id="signInTab" onclick="switchTab('signin')">Sign In</button>
        <button class="tab" id="signUpTab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="test@phishguard.com">
        </div>

        <div class="form-group">
            <label for="password">Password (Min 8 characters)</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>

        <div class="options-row" id="signinOptions">
            <label><input type="checkbox" id="rememberMe"> Remember me</label>
            <a href="#" onclick="handleForgotPassword(event)">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Sign In to Training</button>
    </form>

    <a href="index.html" id="backLink" class="back-link">← Back to Track Selection</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'student';

    const portalTitle = document.getElementById("portalTitle");
    const portalSubtitle = document.getElementById("portalSubtitle");
    const alertBox = document.getElementById("alertBox");
    const backLink = document.getElementById("backLink");

    // Dynamic track branding & back link context
    if (mode === 'student') {
        portalTitle.innerText = "Student Portal";
        portalSubtitle.innerText = "University Security Training";
    } else {
        portalTitle.innerText = "Citizen Portal";
        portalSubtitle.innerText = "Fraud Awareness Training";
    }

    // Keep mode parameter if they go back to index/selection page
    backLink.setAttribute("href", `index.html?mode=${mode}`);

    let isSignUp = false;

    function showAlert(message, type) {
        alertBox.innerText = message;
        alertBox.className = `alert-box ${type}`;
        alertBox.style.display = "block";
    }

    function hideAlert() {
        alertBox.style.display = "none";
    }

    function switchTab(tab) {
        isSignUp = (tab === 'signup');
        hideAlert();
        
        const signInTab = document.getElementById("signInTab");
        const signUpTab = document.getElementById("signUpTab");
        const submitBtn = document.getElementById("submitBtn");
        const signinOptions = document.getElementById("signinOptions");

        if (isSignUp) {
            signUpTab.classList.add("active");
            signInTab.classList.remove("active");
            submitBtn.innerText = "Create Account";
            signinOptions.style.display = "none";
            document.getElementById("authForm").reset();
        } else {
            signInTab.classList.add("active");
            signUpTab.classList.remove("active");
            submitBtn.innerText = "Sign In to Training";
            signinOptions.style.display = "flex";
        }
    }

    function handleSubmit(event) {
        event.preventDefault();
        hideAlert();

        const emailField = document.getElementById("email");
        const passwordField = document.getElementById("password");
        const email = emailField.value.trim().toLowerCase();
        const password = passwordField.value;

        let usersDb = JSON.parse(localStorage.getItem("phishguard_users_db")) || {};

        if (isSignUp) {
            if (password.length < 8) {
                showAlert("Password must be at least 8 characters long.", "error");
                return;
            }

            if (usersDb[email]) {
                showAlert("This test account already exists! Please Sign In.", "error");
                return;
            }

            usersDb[email] = { password: password };
            localStorage.setItem("phishguard_users_db", JSON.stringify(usersDb));

            switchTab('signin');
            emailField.value = email;
            passwordField.value = "";
            showAlert("Account created successfully! Please sign in with your password.", "success");

        } else {
            if (!usersDb[email]) {
                showAlert("No account found. Please click 'Sign Up' first to create a test account.", "error");
                return;
            }

            if (usersDb[email].password !== password) {
                showAlert("Incorrect password. Please try again.", "error");
                return;
            }

            localStorage.setItem("phishguard_user", email);
            localStorage.setItem("phishguard_mode", mode);

            showAlert("Login successful! Redirecting...", "success");
            setTimeout(() => {
                window.location.href = `training.html?mode=${mode}`;
            }, 800);
        }
    }

    function handleForgotPassword(event) {
        event.preventDefault();
        alert("PhishGuard Security Tip: In real phishing attacks, fake 'Forgot Password' links are common vectors used to steal credentials. For testing, simply sign in with your account!");
    }
</script>

</body>
</html>
