<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhishGuard – Training Command Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
  display: flex;
  overflow-x: hidden;
}

/* Background grid */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(to right, #80808012 1px, transparent 1px),
    linear-gradient(to bottom, #80808012 1px, transparent 1px);
  background-size: 24px 24px;
  z-index: -2;
}

/* Glow */
.glow {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 800px;
  height: 800px;
  background: rgba(0, 150, 255, 0.1);
  border-radius: 50%;
  filter: blur(120px);
  transform: translate(-50%, -50%);
  z-index: -1;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  background: #111;
  border-right: 2px solid #222;
  padding: 30px 20px;
  height: 100vh;
}

/* Logo */
.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 30px;
}

.sidebar-logo svg {
  width: 40px;
  height: 40px;
}

.sidebar-title {
  font-size: 22px;
  font-weight: bold;
  color: #00aaff;
}

.sidebar-item {
  font-size: 18px;
  padding: 10px 0;
  color: #cccccc;
  cursor: pointer;
  transition: 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-item svg {
  width: 18px;
  height: 18px;
}

.sidebar-item:hover {
  color: #00aaff;
}

/* MAIN CONTENT */
.main {
  flex: 1;
  padding: 40px;
}

.header-title {
  font-size: 42px;
  color: #00aaff;
  margin-bottom: 10px;
}

.header-subtitle {
  color: #cccccc;
  margin-bottom: 40px;
}

/* Stats */
.stats {
  display: flex;
  gap: 20px;
  margin-bottom: 40px;
}

.stat-box {
  background: #1a1a1a;
  border: 2px solid #333;
  padding: 20px;
  flex: 1;
  border-radius: 12px;
}

.stat-title {
  color: #00aaff;
  font-size: 20px;
  margin-bottom: 10px;
}

.stat-value {
  color: #cccccc;
}

/* NEW CARD STYLE */
.sim-grid {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.sim-card {
  background: #141414;
  border: 2px solid #222;
  padding: 18px 20px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 18px;
  transition: 0.25s;
}

.sim-card:hover {
  border-color: #00aaff;
  background: #1a1a1a;
}

.sim-icon {
  width: 42px;
  height: 42px;
  background: #0d0d0d;
  border-radius: 8px;
  padding: 6px;
  border: 1px solid #333;
}

.sim-info {
  flex: 1;
}

.sim-title {
  font-size: 20px;
  color: #00aaff;
  margin-bottom: 4px;
}

.sim-desc {
  color: #bbbbbb;
  font-size: 14px;
}

.launch-btn {
  background: #00aaff;
  color: black;
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  white-space: nowrap;
}

/* Challenge Mode */
.challenge {
  margin-top: 40px;
  background: #1a1a1a;
  border: 2px solid #333;
  padding: 25px;
  border-radius: 12px;
}

.challenge-title {
  font-size: 22px;
  color: #ffaa00;
  margin-bottom: 10px;
}

.challenge-desc {
  color: #cccccc;
  margin-bottom: 15px;
}

.challenge-btn {
  background: #ffaa00;
  color: black;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

/* POPUP */
.popup-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.popup {
  background: #1a1a1a;
  border: 2px solid #00aaff;
  padding: 30px;
  width: 420px;
  border-radius: 12px;
  text-align: center;
}

.popup h2 {
  color: #00aaff;
  margin-bottom: 15px;
}

.popup p {
  color: #cccccc;
  margin-bottom: 20px;
}

.popup-btn {
  background: #00aaff;
  color: black;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin: 5px;
}
</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="glow"></div>
<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-logo">
    <svg viewBox="0 0 24 24" fill="#00aaff"><circle cx="12" cy="12" r="10"/></svg>
    <div class="sidebar-title">PHISHGUARD</div>
  </div>

  <a href="training.html" class="sidebar-item" style="text-decoration: none; color: inherit;">
    <svg viewBox="0 0 24 24" fill="#cccccc"><circle cx="12" cy="12" r="10"/></svg>
    Training
  </a>

  <a href="dashboard.html" class="sidebar-item" style="text-decoration: none; color: inherit;">
    <svg viewBox="0 0 24 24" fill="#cccccc"><rect x="4" y="4" width="16" height="16"/></svg>
    Dashboard
  </a>

  <a href="leaderboard.html" class="sidebar-item active" style="text-decoration: none; color: inherit;">
    <svg viewBox="0 0 24 24" fill="#cccccc"><path d="M12 2l9 21H3z"/></svg>
    Leaderboard
  </a>

  <a href="learn.html" class="sidebar-item" style="text-decoration: none; color: inherit;">
    <svg viewBox="0 0 24 24" fill="#cccccc"><path d="M4 4h16v16H4z"/></svg>
    Learn
  </a>

  <a href="report.html" class="sidebar-item" style="text-decoration: none; color: inherit;">
    <svg viewBox="0 0 24 24" fill="#cccccc"><circle cx="12" cy="12" r="10"/></svg>
    Report
  </a>

  <a href="settings.html" class="sidebar-item" style="text-decoration: none; color: inherit;">
    <svg viewBox="0 0 24 24" fill="#cccccc"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>
    Settings
  </a>
</div>

<script>
  // Dynamic Mode Injector for Anchor Tags
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode") || "student";

    // Automatically appends ?mode=... to all sidebar links so user mode is never lost
    document.querySelectorAll(".sidebar.a, .sidebar a").forEach(link => {
      let baseHref = link.getAttribute("href").split("?")[0];
      link.setAttribute("href", `${baseHref}?mode=${mode}`);
    });
  });
</script>

<!-- POPUP -->
<div id="popupContainer"></div>

<!-- MAIN CONTENT -->
<div class="main">

  <div class="header-title" id="dashTitle"></div>
  <div class="header-subtitle" id="dashSubtitle"></div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-title">Clearance Level</div>
      <div class="stat-value">Recruit<br>Next rank: Analyst</div>
    </div>

    <div class="stat-box">
      <div class="stat-title">Accuracy Rating</div>
      <div class="stat-value">0%<br>Across 0 operations</div>
    </div>

    <div class="stat-box">
      <div class="stat-title">Active Badges</div>
      <div class="stat-value">0<br>View in Dashboard</div>
    </div>
  </div>

  <div id="simulations" class="sim-grid"></div>

  <div class="challenge">
    <div class="challenge-title">Challenge Mode – 80s Blitz</div>
    <div class="challenge-desc">Mixed emails, URLs, and login pages — answer as many as you can before time runs out.</div>
    <button class="challenge-btn">Start Challenge</button>
  </div>

</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "student";
    
      /* POPUP DATA */
      const popupSteps = {
        student: [
          { title: "Welcome to PhishGuard", text: "This platform trains you to spot university-targeted phishing attacks." },
          { title: "How the simulations work", text: "Each exercise shows you a suspicious communication. Read carefully and decide." },
          { title: "Challenge Mode & Progress", text: "Try Challenge Mode for a 60-second blitz mixing all question types." }
        ],
        elderly: [
          { title: "Welcome to PhishGuard", text: "This platform trains you to spot senior-targeted scams." },
          { title: "How the simulations work", text: "Each exercise shows you a suspicious communication. Read carefully and decide." },
          { title: "Challenge Mode & Progress", text: "Try Challenge Mode for a 60-second blitz mixing all question types." }
        ]
      };
    
      /* SIMULATION DATA */
      const studentSims = [
        { name: "Inbox Intercept", desc: "Analyze incoming emails for phishing vectors.", icon: `<svg viewBox="0 0 24 24" fill="#00aaff"><path d='M3 6l9-4 9 4v6c0 5-4 9-9 9s-9-4-9-9V6z'/></svg>`, link: "simulation-student-inbox.html?mode=student" },
        { name: "URL Inspection", desc: "Spot typosquatting and malicious domains.", icon: `<svg viewBox="0 0 24 24" fill="#00aaff"><circle cx='10' cy='10' r='7'/><line x1='15' y1='15' x2='22' y2='22' stroke='#00aaff' stroke-width='2'/></svg>`, link: "simulation-student-url.html?mode=student" },
        { name: "Spoof Detection", desc: "Identify forged login screens.", icon: `<svg viewBox="0 0 24 24" fill="#00aaff"><rect x='3' y='4' width='18' height='14' rx='2'/><circle cx='12' cy='11' r='3'/></svg>`, link: "simulation-student-spoof.html?mode=student" }
      ];
    
      const elderlySims = [
        { name: "Inbox Intercept", desc: "Analyze incoming emails for phishing vectors.", icon: `<svg viewBox="0 0 24 24" fill="#00aaff"><path d='M3 6l9-4 9 4v6c0 5-4 9-9 9s-9-4-9-9V6z'/></svg>`, link: "simulation-elderly-inbox.html?mode=elderly" },
        { name: "URL Inspection", desc: "Spot typosquatting and malicious domains.", icon: `<svg viewBox="0 0 24 24" fill="#00aaff"><circle cx='10' cy='10' r='7'/><line x1='15' y1='15' x2='22' y2='22' stroke='#00aaff' stroke-width='2'/></svg>`, link: "simulation-elderly-url.html?mode=elderly" },
        { name: "Spoof Detection", desc: "Identify forged login screens.", icon: `<svg viewBox="0 0 24 24" fill="#00aaff"><rect x='3' y='4' width='18' height='14' rx='2'/><circle cx='12' cy='11' r='3'/></svg>`, link: "simulation-elderly-spoof.html?mode=elderly" }
      ];
    
      /* 1. APPLY DASHBOARD TEXT */
      const dashTitle = document.getElementById("dashTitle");
      const dashSub = document.getElementById("dashSubtitle");
      if (dashTitle) dashTitle.textContent = mode === "student" ? "Training Command Center – Student" : "Training Command Center – Elderly";
      if (dashSub) dashSub.textContent = mode === "student" ? "Your simulations are tailored for university phishing threats." : "Your simulations are tailored for senior-targeted scams.";
    
      /* 2. RENDER SIMULATION CARDS */
      const sims = mode === "student" ? studentSims : elderlySims;
      const simContainer = document.getElementById("simulations");
      if (simContainer) {
        sims.forEach(sim => {
          const card = document.createElement("div");
          card.className = "sim-card";
          card.innerHTML = `
            <div class="sim-icon">${sim.icon}</div>
            <div class="sim-info">
              <div class="sim-title">${sim.name}</div>
              <div class="sim-desc">${sim.desc}</div>
            </div>
            <button class="launch-btn" onclick="window.location.href='${sim.link}'">Launch</button>
          `;
          simContainer.appendChild(card);
        });
      }
    
      /* 3. POPUP SYSTEM - SHOWS ONCE ONLY */
      let step = 0;
      const steps = popupSteps[mode];
      const storageKey = `phishguard_seen_popup_${mode}`;
      const popupContainer = document.getElementById("popupContainer");
    
      function showPopup() {
        if (!popupContainer) return;
        const data = steps[step];
        popupContainer.innerHTML = `
          <div class="popup-bg">
            <div class="popup">
              <h2>${data.title}</h2>
              <p>${data.text}</p>
              <button class="popup-btn" onclick="nextPopup()">Next</button>
            </div>
          </div>
        `;
      }
    
      window.nextPopup = () => {
        step++;
        if (step >= steps.length) {
          popupContainer.innerHTML = "";
          localStorage.setItem(storageKey, "true");
        } else {
          showPopup();
        }
      };
    
      if (!localStorage.getItem(storageKey)) {
        showPopup();
      }
    
      /* 4. DASHBOARD STATS */
      const key = mode === "student" ? "phishguard_student_data" : "phishguard_elderly_data";
      const data = JSON.parse(localStorage.getItem(key)) || [];
      let totalScore = 0, totalQuestions = 0;
      data.forEach(r => { totalScore += r.score; totalQuestions += r.total; });
      const accuracy = totalQuestions === 0 ? 0 : Math.round((totalScore / totalQuestions) * 100);
    
      const accEl = document.getElementById("accuracyValue");
      const badgeEl = document.getElementById("badgeValue");
      if (accEl) accEl.innerHTML = `${accuracy}%<br>Across ${data.length} operations`;
      if (badgeEl) badgeEl.innerHTML = `${data.length}<br>View in Dashboard`;
    
      /* 5. CHALLENGE BUTTON */
      const challengeBtn = document.querySelector(".challenge-btn");
      if (challengeBtn) {
        challengeBtn.addEventListener("click", () => {
          window.location.href = `challenge.html?mode=${mode}`;
        });
      }
    });
    </script>
    

</body>
</html>
